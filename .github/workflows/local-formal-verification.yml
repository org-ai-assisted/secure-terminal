## AI-Assisted

## Machine-checked FORMAL VERIFICATION of the pure sanitizer (a PROOF over ALL
## inputs, not a sample). The proof artifact lives out of tree with the other
## suites, in org-ai-assisted/dist-ai (usr/share/secure-terminal-tests/
## verify_formal.py); the reusable dist-ai run checks out only the code under test
## plus dist-ai, so this lane is what makes the proof actually run in CI on every
## change to secure-terminal.
##
## It discharges a family of theorems (T1..T10) with Z3 (SMT) + exhaustive
## enumeration; the two flagship ones:
##   T1  strict-mode output inertness -- render_output emits only inert display
##       bytes for ANY input (the CLI output-becomes-input closure);
##   T2  line-editor containment -- feed_line_edits keeps 0 <= col <= len(cells)
##       inductively, so output never reaches an earlier line (INV-2, pure level).
## T3-T9 cover the input/clipboard/title/cell sanitizers and the chunk-boundary +
## GUI-render paths; T10 (reset-to-prompt baseline) enumerates against pyte as the
## reference oracle -- which is why this lane needs python3-pyte.
##
## The suite is Qt-free (no PyQt6), but it imports secure_terminal.sanitize AND
## secure_terminal.state_dump plus pyte (the reference oracle for the state_dump
## baseline theorem T10), so this lane installs Z3, the sanitizer's own hard
## dependencies (python3-regex, python3-confusable-homoglyphs) and python3-pyte --
## still far lighter than the full Qt test set. python3-confusable-homoglyphs is a HARD dependency of the
## sanitizer: without it the confusables set is empty and is_structural / the
## show-mode whitelist would be checked against the wrong alphabet.

name: formal verification

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: sanitizer formal verification (Z3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    ## CI runs only where we enabled it. Unset variable -> skipped, no runner
    ## allocated, run stays green. ANDed with the fork-PR guard, matching the other
    ## workflows in this repo.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
    permissions:
      contents: read
    steps:
      - name: Checkout secure-terminal (the code under test)
        ## https://github.com/actions/checkout/releases/tag/v7.0.1
        ## > 3d3c42e5aac5ba805825da76410c181273ba90b1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout dist-ai (holds the proof suite)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # dist-ai is tracked at @master ON PURPOSE (not SHA-pinned): the trust boundary
          # is the org account, not the ref -- pinning blocks nothing real, breaks
          # one-fix-everywhere, and leaves CI on stale tooling. Policy:
          # developer-meta-files agents/github-actions.md G-A-004 (branch-tracking).
          repository: org-ai-assisted/dist-ai
          ref: master
          path: _dist-ai
          persist-credentials: false

      - name: Install dependencies (apt only)
        ## Z3 is the proof engine; python3-regex + python3-confusable-homoglyphs are
        ## the sanitizer's own hard runtime dependencies; python3-pyte is the reference
        ## oracle the state_dump baseline theorem (T10) enumerates against (verify_formal
        ## imports pyte + secure_terminal.state_dump). A missing one makes the suite FAIL
        ## loud, never skip -- it is a security-relevant proof. Same apt python3-pyte the
        ## consumer dist-ai-tests lane uses (debian/control depends on it); no fork checkout.
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends \
            python3 python3-z3 python3-regex python3-confusable-homoglyphs python3-pyte

      - name: Run the formal verification against the real checkout
        env:
          PYTHONPATH: ${{ github.workspace }}/usr/lib/python3/dist-packages
        run: _dist-ai/usr/share/secure-terminal-tests/verify_formal.py
