## AI-Assisted

## Gate this repo on the external adversarial corpora, which live in their own
## repos and are therefore not checked out by the reusable dist-ai run.
##   - adversarial:           terminal-poc-corpus, 22 PoCs + canary positive control
##   - git-diffs-lie-corpus:  every content/* payload branch, read from a checkout
##
## The corpus repo already has adversarial.yml, but it triggers on pushes to the
## CORPUS and tests them against secure-terminal master. That is one-directional:
## a change HERE that regresses corpus handling is not caught until the corpus
## repo happens to push again, or never. This workflow closes the other
## direction, so the PoC corpus gates secure-terminal changes too.
##
## dist-ai's terminal-poc-corpus-tests entrypoint cannot serve this: it is
## unreachable from any component-filtered run (dist-ai-tests-all's
## suite_component() has no terminal-poc-corpus case, so it resolves to the empty
## string and never matches a --component), and the reusable always filters by
## component. It would also SKIP (exit 77) without a corpus checkout, which the
## orchestrator counts as green.
##
## Conformance (conformance/acquire.sh + harness/conformance.py) is deliberately
## NOT run here: it fetches third-party suites over the network, which belongs in
## the corpus repo's own scheduled run rather than in a per-push gate.
##
## The harness refuses to decode live payloads outside a sandbox or GitHub CI, and
## leads with a --test-canary positive control so a broken detector fails loud
## instead of passing vacuously.

name: external corpora

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial:
    name: terminal-poc-corpus adversarial
    runs-on: ubuntu-latest
    timeout-minutes: 20
    ## Fork-PR guard, matching the other workflows in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout secure-terminal (the code under test)
        ## https://github.com/actions/checkout/releases/tag/v6.0.2
        ## > de0fac2e4500dabe0009e67214ff5f5447ce83dd
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout terminal-poc-corpus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: secure-terminal/terminal-poc-corpus
          ref: master
          path: _corpus
          persist-credentials: false

      - name: Resolve the declared dependency set
        id: deps
        ## Read the package list from .github/dm-consumer.yml rather than copying
        ## it. usr/bin/secure-terminal preflight-checks its runtime dependencies
        ## and exits 1 naming the first missing one, so a hand-copied list that
        ## falls behind does not fail with "missing PyQt6.QtMultimedia" -- the app
        ## never starts, the --test-canary positive control does not fire, and the
        ## harness refuses to trust the whole run. One source of truth instead.
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends python3-yaml
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import yaml
          with open('.github/dm-consumer.yml', encoding='utf-8') as handle:
              declared = yaml.safe_load(handle)['dist-ai-tests']['apt-packages']
          # python3-jsonschema is the corpus tooling's own need, not secure-terminal's.
          print('packages=%s python3-jsonschema' % declared)
          PY

      - name: Install dependencies (apt only)
        env:
          PACKAGES: ${{ steps.deps.outputs.packages }}
        run: |
          # word splitting is intended: PACKAGES is a space-separated apt list
          # shellcheck disable=SC2086
          sudo apt-get install --yes --no-install-recommends ${PACKAGES}

      - name: Validate the corpus (schema + sanitization lint)
        working-directory: _corpus
        run: python3 tools/validate.py

      - name: Positive control + adversarial corpus
        working-directory: _corpus
        env:
          SECURE_TERMINAL_REPO: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 harness/run.py --self-test
          python3 harness/adversarial.py --self-test
          python3 harness/adversarial.py

  git-diffs-lie-corpus:
    ## Run the corpus suite against the REAL git-diffs-lie checkout. test_corpus.py
    ## resolves it from $GIT_DIFFS_LIE_DIR (the same discovery git-meld-tests uses),
    ## reads every content/* payload branch, and asserts each is safely sanitized --
    ## so a fixture added upstream is exercised automatically instead of being
    ## reported as drift for someone to hand-sync. It also checks the in-tree copy
    ## still matches the branch it stands in for, which is what the separate
    ## drift-checker used to do.
    ##
    ## The in-tree copy is the floor for the reusable dist-ai run, which checks out
    ## only the code under test plus dist-ai; this job is what makes the disk path
    ## actually run in CI rather than only on a developer box.
    name: git-diffs-lie corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout secure-terminal (the code under test)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout dist-ai (holds the suite)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: org-ai-assisted/dist-ai
          ref: master
          path: _dist-ai
          persist-credentials: false

      - name: Checkout git-diffs-lie (all branches)
        ## fetch-depth 0: the fixtures live one per payload BRANCH, so a shallow
        ## single-branch clone would find none. The suite asserts the branches are
        ## readable, so that regression fails loud instead of passing vacuously.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: output-lies/git-diffs-lie
          ref: master
          path: _git-diffs-lie
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies (apt only)
        ## confusable-homoglyphs is a HARD dependency of the sanitizer: without it
        ## the confusables set is empty and the homoglyph assertions pass vacuously.
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends \
            python3 python3-confusable-homoglyphs python3-regex

      - name: Run the corpus suite against the real checkout
        env:
          PYTHONPATH: ${{ github.workspace }}/usr/lib/python3/dist-packages
          GIT_DIFFS_LIE_DIR: ${{ github.workspace }}/_git-diffs-lie
        run: python3 _dist-ai/usr/share/secure-terminal-tests/test_corpus.py
