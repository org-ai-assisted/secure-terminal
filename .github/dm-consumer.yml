## Per-repo parameter overrides. Read at workflow runtime by the reusable
## workflows in developer-meta-files. Top-level keys mirror the consumer-template
## basename without the 'consumer-' prefix.
##
## Spec:
## https://github.com/org-ai-assisted/developer-meta-files/blob/master/agents/github-actions-consumer-templates.md

coverity:
  ## scan.coverity.com project name -- the slash-free name the project is
  ## actually registered under (org-ai-assisted-secure-terminal); the token in
  ## COVERITY_SCAN_TOKEN is scoped to it. An earlier "secure-terminal/secure-terminal"
  ## did not match the registration and 401'd on the build-tool download.
  project-name:    "org-ai-assisted-secure-terminal"
  canonical-repos: "secure-terminal/secure-terminal,org-ai-assisted/secure-terminal"

## The widget suite runs secure-terminal offscreen (PyQt6 + pyte), the fuzz suite
## uses hypothesis, the formal-verification suite (verify_formal.py) uses the Z3
## SMT solver (python3-z3), and the coverage gate uses coverage.py. Homoglyph/confusable
## detection (a runtime dependency) needs python3-confusable-homoglyphs -- without
## it the confusables set is empty and the sanitizer tests FAIL (seen in CI: "the
## Unicode confusables set is populated (0 code points)"). The opt-in
## restricted-terminfo tests compile the shipped entry with `tic` (ncurses-bin),
## and it inherits `use=xterm-16color`, whose compiled parent lives in
## ncurses-term -- absent from trixie-slim, so tic could not resolve it and the
## compile silently fell back to xterm-256color. All on top of python3.
dist-ai-tests:
  ## Check out secure-terminal/terminal-poc-corpus too, so terminal-poc-corpus-tests
  ## can actually resolve a corpus. Without it that suite exits 77, which
  ## dist-ai-tests-all reports as SKIP and counts toward a green run -- the gate
  ## reads as wired while never having run a single PoC.
  terminal-poc-corpus: true
  ## vim/htop/nano/tmux back the full-screen-program E2E (start it in TUI mode,
  ## confirm it renders a frame in the pyte grid, send its quit key, confirm a clean
  ## exit) -- the widget suite FAILS on a program that is absent, so they must be here.
  ##
  ## The last five are for the PoC corpus's conformance harness: python3-pytest runs
  ## pyte's own test suite (Part A), and build-essential/libtool-bin/perl/pkg-config
  ## build libvterm's. Without them those stages skip, which is the false-green this
  ## opt-in exists to remove. python3-jsonschema + python3-yaml are the corpus
  ## schema-validation tooling.
  apt-packages: "python3 python3-pyqt6 python3-pyte python3-hypothesis python3-z3 python3-coverage python3-pyqt6.qtmultimedia python3-confusable-homoglyphs python3-regex ncurses-bin ncurses-term vim htop nano tmux python3-pytest python3-jsonschema python3-yaml build-essential libtool-bin perl pkg-config"
